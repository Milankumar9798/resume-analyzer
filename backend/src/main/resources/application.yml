spring:
  application:
    name: resume-analyzer-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/resume_analyzer}
    username: ${DB_USERNAME:apple}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: ${PORT:8080}
  error:
    include-message: always

app:
  jwt:
    secret: ${JWT_SECRET:change_this_to_a_long_random_secret_in_production}
    expiration-ms: ${JWT_EXPIRATION_MS:604800000} # 7 days
  cors:
    allowed-origins: ${CLIENT_URL:http://localhost:5173}
  groq:
    api-key: ${GROQ_API_KEY:}
    base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1}
    model: ${GROQ_MODEL:llama-3.3-70b-versatile}
  rate-limit:
    ai-requests-per-hour: ${AI_RATE_LIMIT:30}

logging:
  level:
    com.resumeiq: INFO
    org.springframework.security: WARN
